server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 3306
  user: root
  password: ""
  dbname: astro
  charset: utf8mb4

jwt:
  secret: astro-secret-key
  expire: 24h

log:
  level: debug
  file: logs/astro.log
  max_size: 100     # 单个文件最大 100MB
  max_backups: 10   # 保留 10 个旧文件
  max_age: 30       # 保留 30 天
  compress: true    # 启用压缩

kubernetes:
  kubeconfig: ""    # 留空使用集群内配置，本地开发填 ~/.kube/config

oauth2:
  providers:
    authentik:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_url: "http://localhost:5173/oauth2/authentik/callback"
      auth_url: "https://auth.example.com/application/o/authorize/"
      token_url: "https://auth.example.com/application/o/token/"
      userinfo_url: "https://auth.example.com/application/o/userinfo/"
      scopes:
        - openid
        - email
        - profile
